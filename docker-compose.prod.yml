# Production stack: pulls the images published by .github/workflows/cd.yml.
# IMAGE_PREFIX (e.g. ghcr.io/<owner>/<repo>) and IMAGE_TAG are exported by the deploy job.
# Put backend/.env on the server next to this file (see backend/.env.example).
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      retries: 5

  backend:
    image: ${IMAGE_PREFIX:?set IMAGE_PREFIX}/backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      MONGO_URI: mongodb://mongo:27017
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    image: ${IMAGE_PREFIX:?set IMAGE_PREFIX}/frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  mongo-data:
